
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ef">
  <title>Dashboard | CreatorMatch</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body class="dashboard-page">
<header class="navbar">
  <a class="logo" href="dashboard.html">Creator<span>Match</span></a>
  <nav class="nav-links">
    <span id="welcomeUser" class="welcome-user"></span>
    <button id="logoutButton" class="btn btn-small btn-outline" type="button">Log out</button>
  </nav>
</header>

<main class="dashboard">
  <aside class="sidebar">
    <p class="eyebrow">YOUR WORKSPACE</p>
    <div class="sidebar-user">
      <div id="userAvatar" class="avatar">C</div>
      <div><strong id="sidebarName">Welcome</strong><small id="sidebarRole">Member</small></div>
    </div>
    <button class="side-link active" data-view="profile">◉ <span>My Profile</span></button>
    <button class="side-link" data-view="discover">⌕ <span id="discoverLabel">Discover</span></button>
    <button class="side-link" data-view="saved" id="savedNav">♡ <span>Saved Creators</span></button>
    <button class="side-link" data-view="messages">✉ <span>Messages</span></button>
    <div class="sidebar-bottom">
      <p>Good connections start with a conversation.</p>
      <span>Made for meaningful growth ✿</span>
    </div>
  </aside>

  <section class="dashboard-content">
    <div id="dashboardMessage" class="notice" aria-live="polite"></div>
    <div id="dashboardContent">
      <p>Loading your workspace...</p>
    </div>
  </section>
</main>

<footer>© 2026 CreatorMatch <span>·</span> Create. Collaborate. Grow.</footer>
</body>
</html>
